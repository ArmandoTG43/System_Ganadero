{% load static %}
<br><br><br><br>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar Usuario - Sistema Ganadero</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="{% static 'tema/hightech/css/bootstrap.min.css' %}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <!-- jQuery Validate -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e6f4f1, #f0fdfa);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 
             "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 35px 30px;
            box-shadow: 0 15px 40px rgba(15,118,110,0.15);
            max-width: 420px;
            width: 100%;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #0f766e;
            letter-spacing: 1px;
        }

        .login-card label {
            font-weight: 600;
            color: #374151;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            padding: 10px 12px 10px 36px;
            transition: 0.3s;
        }

        .form-select { padding-left: 12px; }

        .form-control:focus,
        .form-select:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 0.2rem rgba(15,118,110,0.2);
        }

        .login-card button {
            width: 100%;
            background: #0f766e;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            padding: 10px;
            color: #fff;
            transition: all 0.3s ease;
        }

        .login-card button:hover {
            background: #115e59;
            transform: translateY(-1px);
        }

        .login-card a.btn-outline-secondary {
            border-radius: 10px;
            border-color: #0f766e;
            color: #0f766e;
            font-weight: 600;
        }

        .login-card a.btn-outline-secondary:hover {
            background: #0f766e;
            color: #fff;
        }

        .login-card a {
            font-size: 0.85rem;
            text-decoration: none;
            color: #0f766e;
            display: block;
            margin-top: 8px;
            text-align: center;
        }

        .login-card a:hover { text-decoration: underline; }

        .login-card small {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 0.75rem;
        }

        .input-icon { position: relative; }

        .input-icon i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #0f766e;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

<div class="login-card">
    <h2>REGISTRAR USUARIO</h2>
    <br>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} text-center py-2" style="font-size: 0.85rem;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    
    <form method="POST" id="registroForm" action="{% url 'registrar_usuario' %}">
        {% csrf_token %}

        <div class="mb-3 input-icon">
            <i class="fa fa-user"></i>
            <input type="text" name="username" class="form-control" placeholder="Usuario" required>
        </div>

        <div class="mb-3 input-icon">
            <i class="fa fa-lock"></i>
            <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
        </div>

        <div class="mb-3 input-icon">
            <i class="fa fa-user-tag"></i>
            <select name="rol" class="form-control" required>
                <option value="">Seleccionar Rol...</option>
                <option value="administrador">Administrador</option>
                <option value="encargado">Encargado</option>
                <option value="revisor">Revisor</option>
            </select>
        </div>

        <button type="submit">
            <i class="fa fa-user-plus"></i> Registrar
        </button>

        <a href="{% url 'login' %}" class="btn btn-outline-secondary mt-2">
            ¿Ya tienes cuenta? Iniciar sesión
        </a>
    </form>

    <small>© 2025 Armand0 Toaquiza. Todos los derechos reservados.</small>
</div>

<script>
$(document).ready(function(){
    $("#registroForm").validate({
        rules: {
            username: { required: true, minlength: 3 },
            password: { required: true, minlength: 5 },
            rol: { required: true }
        },
        messages: {
            username: { required: "Ingrese un nombre de usuario", minlength: "Mínimo 3 caracteres" },
            password: { required: "Ingrese la contraseña", minlength: "Mínimo 5 caracteres" },
            rol: "Seleccione un rol"
        },
        errorClass: "text-danger",
        errorElement: "small",
        highlight: function(element) {
            $(element).addClass("is-invalid");
        },
        unhighlight: function(element) {
            $(element).removeClass("is-invalid");
        }
    });
});
</script>

</body>
</html>

{% load static %}
<br><br><br><br>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña - Sistema Ganadero</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="{% static 'tema/hightech/css/bootstrap.min.css' %}">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e6f4f1, #f0fdfa);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 
             "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 35px 30px;
            box-shadow: 0 15px 40px rgba(15,118,110,0.15);
            max-width: 420px;
            width: 100%;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #0f766e;
            letter-spacing: 1px;
        }

        .login-card p {
            text-align: center;
            font-size: 0.9rem;
            color: #4b5563;
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            padding: 10px 12px 10px 36px;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 0.2rem rgba(15,118,110,0.2);
        }

        .login-card button {
            width: 100%;
            background: #0f766e;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            padding: 10px;
            color: #fff;
            transition: all 0.3s ease;
        }

        .login-card button:hover {
            background: #115e59;
            transform: translateY(-1px);
        }

        .login-card a.btn-outline-primary {
            border-radius: 10px;
            border-color: #0f766e;
            color: #0f766e;
            font-weight: 600;
        }

        .login-card a.btn-outline-primary:hover {
            background: #0f766e;
            color: #fff;
        }

        .login-card a {
            font-size: 0.85rem;
            text-decoration: none;
            color: #0f766e;
            display: block;
            margin-top: 10px;
            text-align: center;
        }

        .login-card a:hover {
            text-decoration: underline;
        }

        .login-card small {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 0.75rem;
        }

        .input-icon {
            position: relative;
            margin-bottom: 18px;
        }

        .input-icon i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #0f766e;
            font-size: 0.9rem;
        }
    </style>

</head>
<body>

<div class="login-card">
    <h2>RECUPERAR CONTRASEÑA</h2>

    <form method="POST" action="{% url 'password_reset' %}">
        {% csrf_token %}
        <div class="input-icon">
            <i class="fa fa-envelope"></i>
            <input type="email" name="email" class="form-control" placeholder="Correo electrónico" required>
        </div>

        <button type="submit">
            <i class="fa fa-paper-plane"></i> Enviar enlace
        </button>
    </form>

    <a href="{% url 'login' %}" class="btn btn-outline-primary w-100 mt-3">
        <i class="fa fa-arrow-left"></i> Volver al login
    </a>
    <small>© 2025 Armand0 Toaquiza. Todos los derechos reservados.</small>
</div>

</body>
</html>

{% extends './plantillas.html' %}
{% block contenido %}

<div class="security-container">

    <div class="security-card">
        <h2>Seguridad</h2>
        <p class="subtitle">Actualiza tu contraseña</p>

        <form method="POST" class="security-form" id ="frm_password">
            {% csrf_token %}

            <div class="field">
                <label>Contraseña actual</label>
                <input type="password" name="password_actual" required>
            </div>

            <div class="field">
                <label>Nueva contraseña</label>
                <input type="password" name="password_nueva" required>
            </div>

            <div class="field">
                <label>Confirmar contraseña</label>
                <input type="password" name="password_confirmar" required>
            </div>

            <div class="actions">
                <a href="{% url 'perfil' %}" class="btn cancel">Cancelar</a>
                <button type="submit" class="btn save">Guardar</button>
            </div>
        </form>
    </div>

</div>
<script>
$(document).ready(function () {

    // 🔐 Método personalizado: contraseña segura
    $.validator.addMethod("passwordSegura", function(value) {
        return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&._-])[A-Za-z\d@$!%*?&._-]{8,}$/.test(value);
    }, "Contraseña insegura");

    $("#frm_password").validate({
        rules: {
            password_actual: {
                required: true
            },
            password_nueva: {
                required: true,
                passwordSegura: true
            },
            password_confirmar: {
                required: true,
                equalTo: 'input[name="password_nueva"]'
            }
        },
        messages: {
            password_actual: "Ingrese su contraseña actual",
            password_nueva: {
                required: "Ingrese una nueva contraseña",
                passwordSegura:
                    "Mínimo 8 caracteres, una mayúscula, una minúscula, un número y un símbolo"
            },
            password_confirmar: {
                required: "Confirme la contraseña",
                equalTo: "Las contraseñas no coinciden"
            }
        },
        errorClass: "text-danger",
        errorElement: "small",
        highlight: function(element) {
            $(element).addClass("is-invalid");
        },
        unhighlight: function(element) {
            $(element).removeClass("is-invalid");
        }
    });

});
</script>

<style>
.security-container {
    min-height: 70vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.security-card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.security-card h2 {
    margin: 0;
    font-size: 22px;
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 25px;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    color: #444;
}

.field input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
    outline: none;
}

.field input:focus {
    border-color: #4f46e5;
}

.actions {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

.btn {
    padding: 10px 18px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
}

.btn.cancel {
    background: #f3f4f6;
    color: #333;
}

.btn.save {
    background: #4f46e5;
    color: white;
    border: none;
}

.btn.save:hover {
    background: #4338ca;
}
</style>

{% endblock %}
